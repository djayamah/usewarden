# Dependabot.
#
# `open-pull-requests-limit` is deliberately small: usewarden has two devDependencies and zero
# runtime dependencies, so a flood of PRs here would mean something is wrong.
#
# The `cooldown` mirrors the `min-release-age=7` in .npmrc. A dependency update that npm would
# refuse to install is not one Dependabot should be opening a PR for, and the 2026 worms were
# all detected and pulled within hours - a week's delay would have caught every one of them.
version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 3
    cooldown:
      default-days: 7
    commit-message:
      prefix: "deps"
    labels:
      - "dependencies"
    # Any new dependency needs a row in docs/DEPENDENCY-BUDGET.md before it is merged.
    reviewers:
      - "djayamah"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 3
    commit-message:
      prefix: "ci"
    labels:
      - "dependencies"
