# Publish `site/` to GitHub Pages — the canonical home for the write-up series.
#
# WHY THIS EXISTS RATHER THAN A HOSTING ACCOUNT (D-222, D-227)
#   D-222 decided the canonical home must be a surface we control, because a page we own can carry
#   `rel=canonical` and a GitHub Discussion cannot. `ops/MANUAL-STEPS.md` then listed "a hosting
#   login" as a founder step, on the assumption that owning a site means renting a server.
#   It does not: GitHub Pages on this repository is free for public repositories, needs no
#   purchase, and is enabled and deployed entirely through the REST API and this workflow.
#
# WHY `build_type: workflow` AND NOT THE LEGACY BRANCH SOURCE
#   The legacy source only accepts `/` or `/docs` as a publishing directory
#   (docs.github.com/en/rest/pages/pages, read 2026-08-24). Our site lives in `site/`, and `docs/`
#   is already the product documentation. A workflow build takes any path, so nothing had to be
#   rearranged to fit the deployment mechanism.
#
# WHAT IT DOES NOT DO
#   It does not build, test, or publish the package. It copies a directory of static files that
#   contain no script, no external asset and no analytics — `tests/site.test.ts` asserts that.
name: pages

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

# Least privilege. `pages: write` and `id-token: write` are the two the deploy step documents as
# required; `contents: read` is for the checkout and nothing else.
permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time, and a queued run supersedes an older one rather than racing it.
# `cancel-in-progress: false` because cancelling a half-finished deploy can leave the site on a
# partial upload, which is a worse failure than waiting.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # THE CONTENT GATE RUNS EVERYWHERE. THE DEPLOY RUNS ONLY WHERE PAGES EXISTS.
  #
  # Split on 2026-09-08 because the private mirror had run this workflow three times and failed
  # three times, and could never have done anything else: GitHub Pages is not enabled on
  # `djayamah/warden` (the API answers 404), so `configure-pages` cannot succeed there. A workflow
  # aimed at a surface that does not exist is the same defect this project keeps finding
  # elsewhere - a guard pointed at a path nobody uses - and a run that is always red is a run
  # nobody reads, which is how the OTHER failure in it stayed invisible for a fortnight (D-272).
  check:
    name: The published site fetches nothing
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # ONE IMPLEMENTATION OF THIS RULE, NOT TWO. It used to be inlined here AND in
      # tests/site.test.ts, and they drifted: the test knew an `<a href>` is navigation rather than
      # a fetch and allowlisted the two primary sources the page cites, while this file still
      # refused every absolute URL in any attribute. Same shape as the internal-only path list
      # before it became one file with three readers.
      - name: Site self-containment
        run: node scripts/check-site-selfcontained.mjs

  deploy:
    needs: check
    # Only the repository that actually has Pages. `vars.PAGES_REPO` lets a fork or a rename say so
    # without editing the workflow; unset falls back to the repository this file is published from.
    if: github.repository == (vars.PAGES_REPO || 'djayamah/usewarden')
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site

      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
